name: Branch format helper

on:
  push:
    branches: [reliability/metrics-hardening-v2]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/metrics-hardening-v2

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Apply narrow reliability replacements
        shell: python
        run: |
          from pathlib import Path

          config = Path("src/profi/config.py")
          text = config.read_text(encoding="utf-8")
          work_marker = "# --- Рабочие часы: локальное время, [lo, hi) ---\n"
          if "TIMEZONE_NAME =" not in text:
              assert text.count(work_marker) == 1
              text = text.replace(
                  work_marker,
                  'TIMEZONE_NAME = (_get("PROFI_TIMEZONE", "Asia/Yekaterinburg") or "Asia/Yekaterinburg").strip()\n\n'
                  "# --- Рабочие часы: business timezone, [lo, hi) ---\n",
              )
              config.write_text(text, encoding="utf-8")

          store = Path("src/profi/storage/store.py")
          text = store.read_text(encoding="utf-8")
          text = text.replace(
              "send_status='unknown', sent_at=COALESCE(sent_at, ?), ",
              "send_status='unknown', sent_at=COALESCE(sent_at, send_started_at, ?), ",
          )

          view_start = text.index("DROP VIEW IF EXISTS v_prompt_experiments;")
          view_end_marker = "GROUP BY prompt_experiment, prompt_variant;\n"
          view_end = text.index(view_end_marker, view_start) + len(view_end_marker)
          new_view = """DROP VIEW IF EXISTS v_prompt_experiments;
          CREATE VIEW v_prompt_experiments AS
          SELECT
              prompt_experiment,
              prompt_variant,
              COUNT(*) AS assigned,
              SUM(CASE WHEN draft_source = 'llm' THEN 1 ELSE 0 END) AS evaluated,
              SUM(CASE WHEN first_reply_source = 'llm' AND first_reply_text IS NOT NULL THEN 1 ELSE 0 END)
                  AS generated,
              SUM(CASE WHEN first_reply_source = 'fallback' AND first_reply_text IS NOT NULL THEN 1 ELSE 0 END)
                  AS fallbacks,
              SUM(CASE WHEN draft_source = 'llm' AND send_status = 'sent' THEN 1 ELSE 0 END)
                  AS sent,
              SUM(
                  CASE
                      WHEN draft_source = 'llm'
                       AND send_status = 'sent'
                       AND first_client_reply_at IS NOT NULL
                      THEN 1 ELSE 0
                  END
              ) AS replied,
              ROUND(
                  100.0 * SUM(
                      CASE WHEN draft_source = 'llm' AND send_status = 'sent' THEN 1 ELSE 0 END
                  ) / NULLIF(SUM(CASE WHEN draft_source = 'llm' THEN 1 ELSE 0 END), 0),
                  1
              ) AS send_rate_pct,
              ROUND(
                  100.0 * SUM(
                      CASE
                          WHEN draft_source = 'llm'
                           AND send_status = 'sent'
                           AND first_client_reply_at IS NOT NULL
                          THEN 1 ELSE 0
                      END
                  ) / NULLIF(
                      SUM(CASE WHEN draft_source = 'llm' AND send_status = 'sent' THEN 1 ELSE 0 END),
                      0
                  ),
                  1
              ) AS reply_rate_pct,
              ROUND(
                  100.0 * SUM(
                      CASE
                          WHEN draft_source = 'llm'
                           AND send_status = 'sent'
                           AND first_client_reply_at IS NOT NULL
                          THEN 1 ELSE 0
                      END
                  ) / NULLIF(SUM(CASE WHEN draft_source = 'llm' THEN 1 ELSE 0 END), 0),
                  1
              ) AS reply_yield_pct,
              ROUND(
                  AVG(
                      CASE
                          WHEN draft_source = 'llm'
                           AND send_status = 'sent'
                           AND first_client_reply_at IS NOT NULL
                           AND sent_at IS NOT NULL
                          THEN (first_client_reply_at - sent_at) / 60.0
                      END
                  ),
                  1
              ) AS avg_reply_min
          FROM candidates
          WHERE prompt_experiment IS NOT NULL AND prompt_variant IS NOT NULL
          GROUP BY prompt_experiment, prompt_variant;
          """
          text = text[:view_start] + new_view + text[view_end:]

          sends_start = text.index("    def sends_today(")
          sends_end = text.index("    def ensure_candidate(", sends_start)
          new_sends = (
              "    def sends_today(self, now=None) -> int:\n"
              "        from profi.utils.workhours import business_now\n"
              "\n"
              "        current = business_now(now)\n"
              "        midnight = current.replace(hour=0, minute=0, second=0, microsecond=0)\n"
              "        row = self.conn.execute(\n"
              "            \"SELECT COUNT(*) FROM candidates WHERE send_status IN ('sent','unknown') \"\n"
              "            \"AND sent_at >= ?\",\n"
              "            (int(midnight.timestamp()),),\n"
              "        ).fetchone()\n"
              "        return int(row[0])\n"
              "\n"
          )
          text = text[:sends_start] + new_sends + text[sends_end:]
          store.write_text(text, encoding="utf-8")

      - name: Apply Ruff format
        run: uv run ruff format .

      - name: Commit formatting and replacements
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align runtime time and experiment metrics"
          git push origin HEAD:reliability/metrics-hardening-v2
