name: Branch format helper

on:
  push:
    branches: [reliability/metrics-hardening-v2]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/metrics-hardening-v2

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Apply narrow reliability replacements
        shell: python
        run: |
          from pathlib import Path

          store = Path("src/profi/storage/store.py")
          text = store.read_text(encoding="utf-8")
          old = "        self.conn.executescript(VIEW_SCHEMA)\n        self.conn.commit()\n"
          new = old + "        self.reconcile_stale_sending()\n"
          if "self.reconcile_stale_sending()" not in text:
              assert text.count(old) == 1
              store.write_text(text.replace(old, new), encoding="utf-8")

          main = Path("src/profi/main.py")
          text = main.read_text(encoding="utf-8")
          old = '            status = "fail"  # площадка показала ошибку — отправки и списания не было'
          new = '            status = "failed"  # площадка показала ошибку — отправки и списания не было'
          if old in text:
              main.write_text(text.replace(old, new), encoding="utf-8")

      - name: Apply Ruff format
        run: uv run ruff format .

      - name: Commit formatting and replacements
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: finalize reliability state and formatting"
          git push origin HEAD:reliability/metrics-hardening-v2
