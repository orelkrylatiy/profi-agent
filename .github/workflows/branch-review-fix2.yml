name: Branch final review fixer

on:
  push:
    branches:
      - feature/capability-dashboard-v1

permissions:
  contents: write

jobs:
  apply-final-review-fixes:
    if: ${{ !contains(github.event.head_commit.message, '[review2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/capability-dashboard-v1
          fetch-depth: 0

      - name: Apply final review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f"{path}: expected {count}, found {actual}")
              p.write_text(text.replace(old, new, count), encoding="utf-8")

          # Capability semantics: probe_due means an expired blocker, not simply "not blocked".
          replace(
              "src/profi/capability.py",
              '''    def probe_due(self, now: int | None = None) -> bool:\n        return not self.is_blocked(now)\n''',
              '''    def probe_due(self, now: int | None = None) -> bool:\n        return self.status in BLOCKING_STATUSES and not self.is_blocked(now)\n''',
          )

          # Only trust an inferred balance for account-wide blocking when the UI labels it.
          replace(
              "src/profi/integration/respond.py",
              '''    ms = re.findall(r"([\\d\\s\\u00a0]+)\\s*₽", txt)\n    if len(ms) >= 2:\n        # футер: «К оплате: N ₽ … <баланс> ₽» — баланс идёт последним\n        out["balance_seen"] = int(ms[-1].replace(" ", "").replace("\\u00a0", ""))\n''',
              '''    balance_match = re.search(\n        r"(?:баланс|на\\s+балансе|доступно)\\s*:?\\s*([\\d\\s\\u00a0]+)\\s*₽",\n        txt,\n        re.IGNORECASE,\n    )\n    if balance_match:\n        out["balance_seen"] = int(\n            balance_match.group(1).replace(" ", "").replace("\\u00a0", "")\n        )\n        out["balance_confident"] = True\n    else:\n        # Legacy UI sometimes exposes two money values without a label. Keep the\n        # value for local diagnostics, but never use this heuristic to freeze an\n        # account as NO_BALANCE.\n        ms = re.findall(r"([\\d\\s\\u00a0]+)\\s*₽", txt)\n        if len(ms) >= 2:\n            out["balance_seen"] = int(ms[-1].replace(" ", "").replace("\\u00a0", ""))\n            out["balance_confident"] = False\n''',
          )

          replace(
              "src/profi/fastpath.py",
              '''    early_to_pay = _int_or_none(early_footer.get("to_pay"))\n    early_balance = _int_or_none(early_footer.get("balance_seen"))\n\n    if config.RESPOND_MODE == "pay":\n        if (\n            early_to_pay is not None\n            and early_to_pay > 0\n            and early_balance is not None\n            and early_balance < early_to_pay\n        ):\n''',
              '''    early_to_pay = _int_or_none(early_footer.get("to_pay"))\n    early_balance = _int_or_none(early_footer.get("balance_seen"))\n    early_balance_confident = early_footer.get("balance_confident") is True\n\n    if config.RESPOND_MODE == "pay":\n        if (\n            early_to_pay is not None\n            and early_to_pay > 0\n            and early_balance is not None\n            and early_balance_confident\n            and early_balance < early_to_pay\n        ):\n''',
          )
          replace(
              "src/profi/fastpath.py",
              '''    capability.mark_ready(\n        "response form available",\n        balance_rub=early_balance,\n        to_pay_rub=early_to_pay,\n    )\n''',
              '''    capability.mark_ready(\n        "response form available",\n        balance_rub=early_balance if early_balance_confident else None,\n        to_pay_rub=early_to_pay,\n    )\n''',
          )
          replace(
              "src/profi/fastpath.py",
              '''    except Exception as exc:\n        store.set_send_status(order_id, "failed")\n        store.set_note(order_id, f"fast-path form failed: {str(exc)[:180]}")\n        return "failed"\n\n    due, why = _payment_due(config.RESPOND_MODE, footer)\n''',
              '''    except Exception as exc:\n        _mark_form_capability(exc)\n        store.set_send_status(order_id, "failed")\n        store.set_note(order_id, f"fast-path form failed: {str(exc)[:180]}")\n        return "failed"\n\n    due, why = _payment_due(config.RESPOND_MODE, footer)\n''',
          )
          replace(
              "src/profi/fastpath.py",
              '''    if due is None:\n        if config.RESPOND_MODE == "commission" and "режим комиссии" in why:\n''',
              '''    if due is None:\n        if config.RESPOND_MODE == "commission" and "режим комиссии" in why:\n''',
          )
          # Insert a final confident-balance gate after payment amount is known.
          marker = '''        store.set_note(order_id, f"скип: {why}")\n        return "skipped"\n\n    if not in_work_hours():\n'''
          insert = '''        store.set_note(order_id, f"скип: {why}")\n        return "skipped"\n\n    if config.RESPOND_MODE == "pay" and due > 0 and footer.get("balance_confident") is True:\n        final_balance = _int_or_none(footer.get("balance_seen"))\n        if final_balance is not None and final_balance < due:\n            capability.mark(\n                capability.NO_BALANCE,\n                "balance is below the response price",\n                balance_rub=final_balance,\n                to_pay_rub=due,\n            )\n            store.set_send_status(order_id, "skipped")\n            store.set_note(order_id, f"скип: недостаточно баланса ({final_balance} ₽ < {due} ₽)")\n            return "skipped"\n\n    if not in_work_hours():\n'''
          replace("src/profi/fastpath.py", marker, insert)

          # Fix/update capability tests to mirror real integration exceptions and money confidence.
          replace(
              "tests/test_capability.py",
              '''    def boom(page, mode):\n        raise RuntimeError("нет ни блока тарифов, ни CTA «Написать клиенту»")\n''',
              '''    def boom(page, mode):\n        raise fastpath.respond_mod.RespondError("нет ни блока тарифов, ни CTA «Написать клиенту»")\n''',
          )
          replace(
              "tests/test_capability.py",
              '''        lambda p: {"to_pay": 200, "balance_seen": 0},\n''',
              '''        lambda p: {"to_pay": 200, "balance_seen": 0, "balance_confident": True},\n''',
          )
          # Add focused regression for heuristic balance: it must not freeze the account before LLM.
          anchor = '''def test_active_capability_block_skips_response_ui_and_llm(monkeypatch, isolated_capability):\n'''
          addition = '''def test_pay_mode_unlabelled_balance_does_not_freeze_account(monkeypatch, isolated_capability):\n    import profi.fastpath as fastpath\n\n    store = _Store()\n    monkeypatch.setattr(fastpath, "in_work_hours", lambda: True)\n    monkeypatch.setattr(fastpath, "commission_paused", lambda: False)\n    monkeypatch.setattr(fastpath.config, "RESPOND_MODE", "pay")\n    monkeypatch.setattr(fastpath.config, "DAILY_SEND_LIMIT", 0)\n    monkeypatch.setattr(fastpath.respond_mod, "_open_respond_form_inner", lambda p, mode: p)\n    monkeypatch.setattr(\n        fastpath.respond_mod,\n        "read_footer",\n        lambda p: {"to_pay": 200, "balance_seen": 0, "balance_confident": False},\n    )\n    monkeypatch.setattr(\n        fastpath,\n        "decide_reply",\n        lambda *a, **k: fastpath.Decision("skip", "test", None, "rules"),\n    )\n\n    result = fastpath.process_open_candidate(\n        object(),\n        object(),\n        store,\n        "94000001",\n        _details(),\n        system_prompt_factory=lambda: "system",\n        user_prompt="order",\n    )\n    assert result == "skipped"\n    state = capability.load_state(isolated_capability)\n    assert state.status == capability.READY\n    assert state.balance_rub is None\n\n\n'''
          if anchor not in Path("tests/test_capability.py").read_text(encoding="utf-8"):
              raise SystemExit("capability test anchor missing")
          text = Path("tests/test_capability.py").read_text(encoding="utf-8")
          Path("tests/test_capability.py").write_text(text.replace(anchor, addition + anchor, 1), encoding="utf-8")

          # Add a true generic failure case: no account-wide UI_UNKNOWN cooldown.
          anchor = '''def test_commission_paid_footer_marks_commission_unavailable(monkeypatch, isolated_capability):\n'''
          addition = '''def test_generic_form_failure_is_failed_without_account_cooldown(monkeypatch, isolated_capability):\n    import profi.fastpath as fastpath\n\n    store = _Store()\n    monkeypatch.setattr(fastpath, "in_work_hours", lambda: True)\n    monkeypatch.setattr(fastpath, "commission_paused", lambda: False)\n    monkeypatch.setattr(fastpath.config, "RESPOND_MODE", "pay")\n    monkeypatch.setattr(fastpath.config, "DAILY_SEND_LIMIT", 0)\n\n    def boom(page, mode):\n        raise RuntimeError("temporary network/page failure")\n\n    monkeypatch.setattr(fastpath.respond_mod, "_open_respond_form_inner", boom)\n    monkeypatch.setattr(\n        fastpath,\n        "decide_reply",\n        lambda *a, **k: pytest.fail("LLM must not run after form failure"),\n    )\n    result = fastpath.process_open_candidate(\n        object(), object(), store, "94000001", _details(),\n        system_prompt_factory=lambda: "system", user_prompt="order"\n    )\n    assert result == "failed"\n    assert capability.load_state(isolated_capability).status == capability.UNKNOWN\n\n\n'''
          text = Path("tests/test_capability.py").read_text(encoding="utf-8")
          if anchor not in text:
              raise SystemExit("commission test anchor missing")
          Path("tests/test_capability.py").write_text(text.replace(anchor, addition + anchor, 1), encoding="utf-8")

          # UI copy/freshness semantics and A/B uncertainty.
          replace(
              "dashboard/src/App.tsx",
              '''function formatTimestamp(value: number): string {\n''',
              '''function wilson95(successes: number, total: number): string {\n  if (total <= 0) return '—'\n  const z = 1.96\n  const p = successes / total\n  const z2 = z * z\n  const denom = 1 + z2 / total\n  const center = (p + z2 / (2 * total)) / denom\n  const margin =\n    (z * Math.sqrt((p * (1 - p) + z2 / (4 * total)) / total)) / denom\n  return `${compactNumber.format(Math.max(0, (center - margin) * 100))}–${compactNumber.format(\n    Math.min(100, (center + margin) * 100),\n  )}%`\n}\n\nfunction formatTimestamp(value: number): string {\n''',
          )
          replace(
              "dashboard/src/App.tsx",
              '''                      <Table.Th>Yield %</Table.Th>\n                      <Table.Th>Сред. ответ</Table.Th>\n''',
              '''                      <Table.Th>Yield %</Table.Th>\n                      <Table.Th>95% CI yield</Table.Th>\n                      <Table.Th>Сред. ответ</Table.Th>\n''',
          )
          replace(
              "dashboard/src/App.tsx",
              '''                        <Table.Td>\n                          <Text fw={700}>{pct(row.reply_yield_pct)}</Text>\n                        </Table.Td>\n                        <Table.Td>\n''',
              '''                        <Table.Td>\n                          <Text fw={700}>{pct(row.reply_yield_pct)}</Text>\n                        </Table.Td>\n                        <Table.Td>{wilson95(row.replied, row.evaluated)}</Table.Td>\n                        <Table.Td>\n''',
          )
          replace(
              "dashboard/src/App.tsx",
              '''        <KpiCard label="Ответы" value={current.replies} hint="клиент ответил" />\n''',
              '''        <KpiCard label="Ответы" value={current.replies} hint="ответили по сегодняшнему cohort" />\n''',
          )
          replace(
              "dashboard/src/App.tsx",
              '''              {data.source_date ? `Срез за ${data.source_date}` : 'Дата среза неизвестна'}\n              {data.source_code_revision ? ` · ${data.source_code_revision}` : ''}\n''',
              '''              {data.source_date ? `Срез за ${data.source_date}` : 'Дата среза неизвестна'}\n              {data.source_generated_at ? ` · собран ${data.source_generated_at}` : ''}\n              {data.source_code_revision ? ` · ${data.source_code_revision.slice(0, 8)}` : ''}\n''',
          )
          replace(
              "dashboard/src/App.tsx",
              '''              Ожидаемый источник: {dashboardDataUrl()}. После первого запуска daily_publish\n              появится ops/dashboard.json.\n''',
              '''              Ожидаемый источник: {dashboardDataUrl()}. Сначала запусти\n              python scripts/ops/dashboard_export.py; dataset останется локальным.\n''',
          )
          replace(
              "dashboard/src/App.tsx",
              '''          Публичный dataset не содержит логины, имена клиентов, тексты сообщений, raw logs,\n          order IDs или точные балансы.\n''',
              '''          Локальный dashboard dataset не содержит логины, имена клиентов, тексты сообщений,\n          raw logs, order IDs или точные балансы и по умолчанию не коммитится в Git.\n''',
          )

          # README: make the first-run path explicit.
          replace(
              "dashboard/README.md",
              '''Из `dashboard/`:\n\n```bash\nnpm install\nnpm run dev\n```\n''',
              '''Сначала из корня репозитория собери локальный dataset:\n\n```bash\npython scripts/ops/dashboard_export.py\n```\n\nЗатем из `dashboard/`:\n\n```bash\nnpm install\nnpm run dev\n```\n''',
          )
          PY

      - name: Commit final review fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: final architecture and dashboard review [review2]"
          git push origin HEAD:feature/capability-dashboard-v1
