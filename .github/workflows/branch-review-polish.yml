name: Branch deep-review polish

on:
  push:
    branches:
      - feature/capability-dashboard-v1

permissions:
  contents: write

jobs:
  polish:
    if: ${{ !contains(github.event.head_commit.message, '[deep-polish]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/capability-dashboard-v1
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply deep-review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}")
              p.write_text(text.replace(old, new, count), encoding="utf-8")

          # --- Ops account discovery: only explicitly configured accounts may appear in reports. ---
          p = Path("scripts/ops/daily_report.py")
          text = p.read_text(encoding="utf-8")
          start = text.index("def _discover_databases(root: Path) -> dict[str, Path]:")
          end = text.index("\n\ndef _empty_runtime()", start)
          new = '''def _configured_databases(root: Path) -> dict[str, Path]:\n    """Account allowlist from local ``accounts/*.env`` only.\n\n    Arbitrary ``data/*.db`` files and stale diagnostic logs must never become\n    public account names in ops snapshots. The env files are local/gitignored,\n    but their filenames are the canonical runtime account aliases.\n    """\n    found: dict[str, Path] = {}\n    accounts_dir = root / "accounts"\n    if not accounts_dir.exists():\n        return found\n    for env_path in sorted(accounts_dir.glob("*.env")):\n        account = env_path.stem\n        env = _read_env(env_path)\n        raw_db = env.get("PROFI_DB")\n        db_path = Path(raw_db) if raw_db else root / "data" / f"{account}.db"\n        if not db_path.is_absolute():\n            db_path = root / db_path\n        found[account] = db_path.resolve()\n    return found\n\n\ndef _discover_databases(root: Path) -> dict[str, Path]:\n    return {\n        account: path\n        for account, path in _configured_databases(root).items()\n        if path.exists()\n    }\n'''
          p.write_text(text[:start] + new + text[end:], encoding="utf-8")

          replace(
              "scripts/ops/daily_report.py",
              '''def _scan_logs(root: Path, target: date) -> dict:\n''',
              '''def _scan_logs(root: Path, target: date, *, allowed_accounts: set[str] | None = None) -> dict:\n''',
          )
          # Filter a canonical-looking file before it contributes to any global or per-account metric.
          needle = '''        account = match.group("account") or "global"\n        files_scanned += 1\n'''
          replacement = '''        account = match.group("account") or "global"\n        if allowed_accounts is not None and account != "global" and account not in allowed_accounts:\n            ignored_other_log_files += 1\n            continue\n        files_scanned += 1\n'''
          replace("scripts/ops/daily_report.py", needle, replacement)

          old = '''def build_report(root: Path, target: date, tz: tzinfo) -> dict:\n    start_ts, end_ts = _window_epoch(target, tz)\n    databases = _discover_databases(root)\n    accounts = {account: _db_metrics(path, start_ts, end_ts) for account, path in databases.items()}\n    logs = _scan_logs(root, target)\n\n    runtime_by_account = logs.pop("runtime_by_account", {})\n'''
          new = '''def build_report(root: Path, target: date, tz: tzinfo) -> dict:\n    start_ts, end_ts = _window_epoch(target, tz)\n    configured = _configured_databases(root)\n    accounts: dict[str, dict] = {}\n    for account, path in configured.items():\n        if path.exists():\n            accounts[account] = _db_metrics(path, start_ts, end_ts)\n        else:\n            metrics = _empty_metrics()\n            metrics["db_read_error"] = True\n            accounts[account] = metrics\n    logs = _scan_logs(root, target, allowed_accounts=set(configured))\n\n    runtime_by_account = logs.pop("runtime_by_account", {})\n'''
          replace("scripts/ops/daily_report.py", old, new)

          # Tests now model production: account aliases come from local env files; junk db/log is ignored.
          replace(
              "tests/test_ops_daily.py",
              '''def _run_report(tmp_path: Path) -> tuple[dict, str]:\n    repo_root = Path(__file__).resolve().parents[1]\n''',
              '''def _run_report(tmp_path: Path) -> tuple[dict, str]:\n    (tmp_path / "accounts").mkdir(exist_ok=True)\n    (tmp_path / "accounts" / "info.env").write_text(\n        "PROFI_DB=data/info.db\\n", encoding="utf-8"\n    )\n    repo_root = Path(__file__).resolve().parents[1]\n''',
          )
          append = '''\n\ndef test_daily_report_ignores_unconfigured_databases_and_logs(tmp_path: Path):\n    (tmp_path / "data").mkdir()\n    (tmp_path / "logs").mkdir()\n    _make_db(tmp_path / "data" / "info.db")\n    _make_db(tmp_path / "data" / "vps.db")\n    (tmp_path / "logs" / "worker-vps.log").write_text(\n        "2026-09-03 13:00:00 ERROR profi.main: FEED_CAPTURE_ERROR\\n", encoding="utf-8"\n    )\n\n    report, report_text = _run_report(tmp_path)\n\n    assert set(report["accounts"]) == {"info"}\n    assert "vps" not in report_text\n    assert report["logs"]["ignored_other_log_files"] >= 1\n'''
          Path("tests/test_ops_daily.py").write_text(
              Path("tests/test_ops_daily.py").read_text(encoding="utf-8") + append,
              encoding="utf-8",
          )

          # --- Dashboard: use a live, in-memory current-day ops snapshot by default. ---
          p = Path("scripts/ops/dashboard_export.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace("import argparse\nimport json\nimport sqlite3\n", "import argparse\nimport json\nimport os\nimport sqlite3\n")
          text = text.replace("from pathlib import Path\n", "from pathlib import Path\nfrom zoneinfo import ZoneInfo\n\nimport daily_report as daily_ops\n")
          helper_anchor = '''def _history_row(snapshot: dict) -> dict:\n'''
          helper = '''def _business_timezone(name: str):\n    try:\n        return ZoneInfo(name)\n    except Exception:\n        if name == "Asia/Yekaterinburg":\n            return daily_ops.timezone(daily_ops.timedelta(hours=5), name=name)\n        raise\n\n\ndef _current_snapshot(root: Path, persisted_latest: dict, override: Path | None = None) -> dict:\n    if override is not None:\n        snapshot = _read_json(override, {})\n        if not isinstance(snapshot, dict) or snapshot.get("schema_version") != 2:\n            raise ValueError(f"current snapshot is not schema v2: {override}")\n        return snapshot\n\n    timezone_name = (\n        os.environ.get("PROFI_TIMEZONE")\n        or (persisted_latest.get("timezone") if isinstance(persisted_latest, dict) else None)\n        or daily_ops.DEFAULT_TIMEZONE\n    )\n    tz = _business_timezone(str(timezone_name))\n    target = daily_ops._resolve_date("today", tz)\n    return daily_ops.build_report(root, target, tz)\n\n\n'''
          if helper_anchor not in text:
              raise SystemExit("dashboard exporter history anchor missing")
          text = text.replace(helper_anchor, helper + helper_anchor, 1)

          old_sig = '''def build(root: Path, *, days: int = 30) -> dict:\n    now = datetime.now(UTC)\n    now_ts = int(now.timestamp())\n    warnings: list[str] = []\n\n    raw_latest = _read_json(root / "ops" / "latest.json", {})\n    latest = (\n        raw_latest if isinstance(raw_latest, dict) and raw_latest.get("schema_version") == 2 else {}\n    )\n    if not latest:\n        warnings.append("latest_snapshot_missing_or_not_v2")\n'''
          new_sig = '''def build(root: Path, *, days: int = 30, current_snapshot: Path | None = None) -> dict:\n    now = datetime.now(UTC)\n    now_ts = int(now.timestamp())\n    warnings: list[str] = []\n\n    raw_latest = _read_json(root / "ops" / "latest.json", {})\n    persisted_latest = raw_latest if isinstance(raw_latest, dict) else {}\n    latest = _current_snapshot(root, persisted_latest, current_snapshot)\n'''
          replace("scripts/ops/dashboard_export.py", old_sig, new_sig)
          # History is completed/persisted days only; never mix a partial current business day into trends.
          replace(
              "scripts/ops/dashboard_export.py",
              '''            if snap.get("schema_version") != 2:\n                legacy_history_skipped += 1\n                continue\n            v2_snapshots.append(snap)\n    snapshots = v2_snapshots[-max(1, days) :]\n''',
              '''            if snap.get("schema_version") != 2:\n                legacy_history_skipped += 1\n                continue\n            if snap.get("date") == latest.get("date"):\n                continue\n            v2_snapshots.append(snap)\n    snapshots = v2_snapshots[-max(1, days) :]\n''',
          )
          # Surface DB-read problems for configured accounts rather than silently showing zeroes.
          replace(
              "scripts/ops/dashboard_export.py",
              '''        if name not in latest_accounts:\n            warnings.append(f"{public_id}:metrics_missing_from_latest")\n        public_accounts.append(\n''',
              '''        if name not in latest_accounts:\n            warnings.append(f"{public_id}:metrics_missing_from_current")\n        elif (latest_accounts.get(name) or {}).get("db_read_error"):\n            warnings.append(f"{public_id}:db_read_error")\n        public_accounts.append(\n''',
          )
          replace(
              "scripts/ops/dashboard_export.py",
              '''    parser.add_argument("--days", type=int, default=30)\n    args = parser.parse_args()\n''',
              '''    parser.add_argument("--days", type=int, default=30)\n    parser.add_argument(\n        "--current-snapshot",\n        type=Path,\n        default=None,\n        help="optional schema-v2 snapshot override (tests/debug); default builds today live",\n    )\n    args = parser.parse_args()\n''',
          )
          replace(
              "scripts/ops/dashboard_export.py",
              '''    payload = build(root, days=args.days)\n''',
              '''    payload = build(root, days=args.days, current_snapshot=args.current_snapshot)\n''',
          )

          # Existing exporter fixtures explicitly inject their synthetic current snapshot.
          test = Path("tests/test_dashboard_export.py")
          t = test.read_text(encoding="utf-8")
          old_cmd = '''        [sys.executable, str(script), "--root", str(root), "--output", str(output)],\n'''
          new_cmd = '''        [\n            sys.executable,\n            str(script),\n            "--root",\n            str(root),\n            "--output",\n            str(output),\n            "--current-snapshot",\n            str(root / "ops" / "latest.json"),\n        ],\n'''
          if t.count(old_cmd) != 2:
              raise SystemExit(f"dashboard exporter command count unexpected: {t.count(old_cmd)}")
          t = t.replace(old_cmd, new_cmd)
          t += '''\n\ndef test_dashboard_export_default_builds_live_snapshot_without_touching_ops(tmp_path):\n    root = tmp_path\n    (root / "accounts").mkdir()\n    (root / "data").mkdir()\n    (root / "logs").mkdir()\n    (root / "ops" / "daily").mkdir(parents=True)\n    output = root / "dashboard" / "public" / "ops" / "dashboard.json"\n    script = Path(__file__).resolve().parents[1] / "scripts" / "ops" / "dashboard_export.py"\n\n    subprocess.run(\n        [sys.executable, str(script), "--root", str(root), "--output", str(output)],\n        check=True,\n    )\n    payload = json.loads(output.read_text(encoding="utf-8"))\n    assert payload["schema_version"] == 2\n    assert payload["source_date"] is not None\n    assert payload["source_generated_at"] is not None\n    assert payload["accounts"] == []\n    assert "no_explicit_accounts_discovered" in payload["data_quality"]["warnings"]\n    assert not (root / "ops" / "latest.json").exists()\n'''
          test.write_text(t, encoding="utf-8")

          # --- UI: accurate source date/freshness and no fake zero bars for absent A/B data. ---
          replace(
              "dashboard/src/data.ts",
              '''  if (!Array.isArray(data.accounts) || !Array.isArray(data.history) || !Array.isArray(data.experiments)) {\n    throw new Error('dashboard data: malformed collections')\n  }\n  return data as DashboardData\n}\n''',
              '''  if (!Array.isArray(data.accounts) || !Array.isArray(data.history) || !Array.isArray(data.experiments)) {\n    throw new Error('dashboard data: malformed collections')\n  }\n  if (typeof data.generated_at !== 'string' || !data.data_quality || !Array.isArray(data.data_quality.warnings)) {\n    throw new Error('dashboard data: malformed metadata')\n  }\n  return data as DashboardData\n}\n\nexport function snapshotAgeMinutes(data: DashboardData, nowMs = Date.now()): number | null {\n  const source = data.source_generated_at || data.generated_at\n  const parsed = Date.parse(source)\n  if (!Number.isFinite(parsed)) return null\n  return Math.max(0, (nowMs - parsed) / 60_000)\n}\n''',
          )
          replace(
              "dashboard/src/App.tsx",
              '''import { dashboardDataUrl, loadDashboardData } from './data'\n''',
              '''import { dashboardDataUrl, loadDashboardData, snapshotAgeMinutes } from './data'\n''',
          )
          replace(
              "dashboard/src/App.tsx",
              '''function experimentChartRows(rows: ExperimentRow[]) {\n  return rows.map((row) => ({\n    variant: `${row.account_id} · ${row.prompt_variant}`,\n    send_rate: row.send_rate_pct || 0,\n    reply_rate: row.reply_rate_pct || 0,\n    reply_yield: row.reply_yield_pct || 0,\n  }))\n}\n''',
              '''function experimentChartRows(rows: ExperimentRow[]) {\n  return rows\n    .filter((row) => row.evaluated > 0)\n    .map((row) => ({\n      variant: `${row.account_id} · ${row.prompt_variant}`,\n      send_rate: row.send_rate_pct ?? 0,\n      reply_yield: row.reply_yield_pct ?? 0,\n    }))\n}\n''',
          )
          replace(
              "dashboard/src/App.tsx",
              '''                  { name: 'reply_yield', label: 'Yield', color: 'teal.6' },\n                  { name: 'send_rate', label: 'Send rate', color: 'indigo.6' },\n                  { name: 'reply_rate', label: 'Reply rate', color: 'grape.6' },\n''',
              '''                  { name: 'reply_yield', label: 'Yield', color: 'teal.6' },\n                  { name: 'send_rate', label: 'Send rate', color: 'indigo.6' },\n''',
          )
          replace(
              "dashboard/src/App.tsx",
              '''          <Text fw={700}>Воронка сегодня</Text>\n''',
              '''          <Text fw={700}>Воронка cohort · {data.source_date || 'текущий срез'}</Text>\n''',
          )
          replace(
              "dashboard/src/App.tsx",
              '''        <KpiCard label="Ответы" value={current.replies} hint="ответили по сегодняшнему cohort" />\n''',
              '''        <KpiCard\n          label="Ответы"\n          value={current.replies}\n          hint={data.source_date ? `cohort ${data.source_date}` : 'cohort среза'}\n        />\n''',
          )
          # Dashboard-level age warning uses source snapshot time, not just JSON generation time.
          replace(
              "dashboard/src/App.tsx",
              '''function Dashboard({\n  data,\n  onRefresh,\n  refreshing,\n}: {\n''',
              '''function Dashboard({\n  data,\n  onRefresh,\n  refreshing,\n}: {\n''',
          )
          replace(
              "dashboard/src/App.tsx",
              '''}) {\n  return (\n    <Container size="xl" py={{ base: 'md', md: 'xl' }}>\n''',
              '''}) {\n  const ageMinutes = snapshotAgeMinutes(data)\n  const stale = ageMinutes !== null && ageMinutes > 15\n\n  return (\n    <Container size="xl" py={{ base: 'md', md: 'xl' }}>\n''',
              1,
          )
          replace(
              "dashboard/src/App.tsx",
              '''          <Button variant="light" onClick={onRefresh} loading={refreshing}>\n            Обновить\n          </Button>\n''',
              '''          <Button variant="light" onClick={onRefresh} loading={refreshing}>\n            Перечитать срез\n          </Button>\n''',
          )
          replace(
              "dashboard/src/App.tsx",
              '''        {(data.data_quality.warnings.length > 0 || !data.source_generated_at) && (\n          <Alert color="yellow" title="Проверь свежесть данных">\n            {data.source_generated_at\n              ? `Исходный ops-срез: ${data.source_generated_at}. `\n              : 'У исходного ops-среза нет времени генерации. '}\n            {data.data_quality.warnings.length > 0\n              ? `Data quality: ${data.data_quality.warnings.join(', ')}`\n              : ''}\n          </Alert>\n        )}\n''',
              '''        {(stale || data.data_quality.warnings.length > 0 || !data.source_generated_at) && (\n          <Alert color={stale ? 'orange' : 'yellow'} title="Проверь свежесть данных">\n            {data.source_generated_at\n              ? `Исходный ops-срез: ${data.source_generated_at}. `\n              : 'У исходного ops-среза нет времени генерации. '}\n            {stale && ageMinutes !== null ? `Возраст данных: ${Math.round(ageMinutes)} мин. ` : ''}\n            {data.data_quality.warnings.length > 0\n              ? `Data quality: ${data.data_quality.warnings.join(', ')}`\n              : ''}\n          </Alert>\n        )}\n''',
          )

          # Data contract tests now cover metadata and freshness calculation.
          replace(
              "dashboard/src/data.test.ts",
              '''import { loadDashboardData, validateDashboardData } from './data'\n''',
              '''import { loadDashboardData, snapshotAgeMinutes, validateDashboardData } from './data'\n''',
          )
          replace(
              "dashboard/src/data.test.ts",
              '''  it('loads a valid v2 payload through fetch', async () => {\n''',
              '''  it('rejects malformed v2 metadata before React can crash', () => {\n    expect(() => validateDashboardData({ ...payload, data_quality: undefined })).toThrow(\n      /malformed metadata/,\n    )\n  })\n\n  it('computes source freshness from the ops snapshot timestamp', () => {\n    expect(\n      snapshotAgeMinutes(payload, Date.parse('2026-09-14T12:14:00Z')),\n    ).toBeCloseTo(15, 5)\n  })\n\n  it('loads a valid v2 payload through fetch', async () => {\n''',
          )

          # README: exporter is live and safe to refresh frequently without dirtying tracked ops files.
          replace(
              "dashboard/README.md",
              '''1. `ops/latest.json` и `ops/daily/*.json` — агрегированная история;\n2. локальных account SQLite DB — только агрегаты `v_prompt_experiments`;\n3. локальных `data/<account>.capability.json` — только публичное состояние capability.\n''',
              '''1. локальных SQLite + canonical logs — свежий текущий business-day срез (в памяти, без записи в `ops/`);\n2. `ops/daily/*.json` — завершённая агрегированная история прошлых дней;\n3. локальных account SQLite DB — агрегаты `v_prompt_experiments`;\n4. локальных `data/<account>.capability.json` — текущее публичное состояние capability.\n''',
          )
          replace(
              "dashboard/README.md",
              '''`daily_publish.sh` автоматически обновляет локальный dataset вместе с дневным snapshot, но не добавляет его в Git. Для удалённого доступа dashboard нужно раздавать приватно.\n''',
              '''`daily_publish.sh` автоматически обновляет локальный dataset вместе с дневным snapshot, но не добавляет его в Git. Сам `dashboard_export.py` можно безопасно запускать хоть каждые 5 минут: он строит текущий срез в памяти и не переписывает tracked `ops/latest.json`. Для удалённого доступа dashboard нужно раздавать приватно.\n''',
          )
          replace(
              "dashboard/README.md",
              '''Если раздавать корень репозитория статическим сервером, production build в `dashboard/dist/` также сможет читать `/ops/dashboard.json`.\n''',
              '''Для почти live локального dashboard можно повесить только exporter на cron, например раз в 5 минут; это не делает git commit. При статическом production build dataset нужно раздавать отдельно/копировать в `dist/ops/` или задать `VITE_DASHBOARD_DATA_URL`.\n''',
          )
          PY

      - name: Generate dashboard lockfile
        working-directory: dashboard
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Format touched Python files
        run: |
          uv sync
          uv run ruff format \
            scripts/ops/daily_report.py \
            scripts/ops/dashboard_export.py \
            src/profi/capability.py \
            src/profi/fastpath.py \
            src/profi/integration/respond.py \
            tests/test_capability.py \
            tests/test_dashboard_export.py \
            tests/test_ops_daily.py

      - name: Commit deep polish
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: deep architecture and dashboard polish [deep-polish]"
          git push origin HEAD:feature/capability-dashboard-v1
