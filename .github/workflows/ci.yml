name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "ops/**"
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Production worker preflight
        run: |
          cp accounts/lang.env.example accounts/ci-preflight.env
          bash scripts/account/preflight_worker.sh ci-preflight

      - name: Ruff lint
        run: uv run ruff check .

      # shellcheck предустановлен на ubuntu-latest
      - name: ShellCheck
        run: git ls-files 'scripts/**/*.sh' | xargs -n1 shellcheck

      - name: Tests
        run: uv run pytest -q

      # В base/main всё ещё есть старые format-only места. Runtime gates выше
      # остаются blocking; style debt пока только видим в отчёте.
      - name: Legacy Ruff format report
        continue-on-error: true
        run: uv run ruff format --check .

  dashboard-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dashboard dependencies
        run: npm install --no-audit --no-fund

      - name: Build dashboard
        run: npm run build

  windows-supervisor:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Windows supervisor and native-process tests
        run: >-
          uv run pytest -q
          tests/test_windows_supervisor.py
          tests/test_windows_native_stderr.py
