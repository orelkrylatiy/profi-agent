name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "ops/**"
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      # shellcheck предустановлен на ubuntu-latest
      - name: ShellCheck
        run: git ls-files 'scripts/**/*.sh' | xargs -n1 shellcheck

      - name: Tests
        run: uv run pytest -q

      - name: Ruff format check
        run: uv run ruff format --check .
