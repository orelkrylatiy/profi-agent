name: Ops account allowlist fixer v2

on:
  push:
    branches:
      - feature/capability-dashboard-v1

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[ops-allowlist]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/capability-dashboard-v1
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Apply fix
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/fix_ops.py
          python /tmp/fix_ops.py

      - name: Validate and format
        run: |
          uv sync
          uv run ruff format scripts/ops/daily_report.py tests/test_ops_daily.py
          uv run ruff check scripts/ops/daily_report.py tests/test_ops_daily.py
          uv run pytest -q tests/test_ops_daily.py tests/test_dashboard_export.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ops/daily_report.py tests/test_ops_daily.py
          git commit -m "fix: restrict ops metrics to configured accounts [ops-allowlist]"
          git push origin HEAD:feature/capability-dashboard-v1
