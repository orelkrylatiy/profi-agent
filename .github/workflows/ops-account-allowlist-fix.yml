name: Ops account allowlist fixer

on:
  push:
    branches:
      - feature/capability-dashboard-v1

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[ops-allowlist]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/capability-dashboard-v1
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Restrict ops metrics to configured accounts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/ops/daily_report.py')
          text = p.read_text(encoding='utf-8')

          start = text.index('def _discover_databases(root: Path) -> dict[str, Path]:')
          end = text.index('\n\ndef _empty_runtime()', start)
          replacement = '''def _configured_databases(root: Path) -> dict[str, Path]:
    """Return the explicit local account allowlist from ``accounts/*.env``.

    Arbitrary ``data/*.db`` files are diagnostics/state, not accounts.  Treating
    every DB as an account previously leaked stale aliases such as ``vps`` and
    ``cron`` into the public aggregate snapshot.
    """
    found: dict[str, Path] = {}
    accounts_dir = root / "accounts"
    if not accounts_dir.exists():
        return found
    for env_path in sorted(accounts_dir.glob("*.env")):
        account = env_path.stem
        env = _read_env(env_path)
        raw_db = env.get("PROFI_DB")
        db_path = Path(raw_db) if raw_db else root / "data" / f"{account}.db"
        if not db_path.is_absolute():
            db_path = root / db_path
        found[account] = db_path.resolve()
    return found


def _discover_databases(root: Path) -> dict[str, Path]:
    return {
        account: path
        for account, path in _configured_databases(root).items()
        if path.exists()
    }
'''
          text = text[:start] + replacement + text[end:]

          old = 'def _scan_logs(root: Path, target: date) -> dict:\n'
          new = 'def _scan_logs(root: Path, target: date, *, allowed_accounts: set[str] | None = None) -> dict:\n'
          if old not in text:
              raise SystemExit('scan signature not found')
          text = text.replace(old, new, 1)

          old = '''        files_scanned += 1
        source = match.group("source")
        account = match.group("account") or "global"
        files_by_account[account] += 1
'''
          new = '''        source = match.group("source")
        account = match.group("account") or "global"
        if allowed_accounts is not None and account != "global" and account not in allowed_accounts:
            ignored_other_log_files += 1
            continue
        files_scanned += 1
        files_by_account[account] += 1
'''
          if old not in text:
              raise SystemExit('canonical log block not found')
          text = text.replace(old, new, 1)

          old = '''def build_report(root: Path, target: date, tz: tzinfo) -> dict:
    start_ts, end_ts = _window_epoch(target, tz)
    databases = _discover_databases(root)
    accounts = {account: _db_metrics(path, start_ts, end_ts) for account, path in databases.items()}
    logs = _scan_logs(root, target)

    runtime_by_account = logs.pop("runtime_by_account", {})
'''
          new = '''def build_report(root: Path, target: date, tz: tzinfo) -> dict:
    start_ts, end_ts = _window_epoch(target, tz)
    configured = _configured_databases(root)
    accounts: dict[str, dict] = {}
    for account, path in configured.items():
        if path.exists():
            accounts[account] = _db_metrics(path, start_ts, end_ts)
        else:
            metrics = _empty_metrics()
            metrics["db_read_error"] = True
            accounts[account] = metrics
    logs = _scan_logs(root, target, allowed_accounts=set(configured))

    runtime_by_account = logs.pop("runtime_by_account", {})
'''
          if old not in text:
              raise SystemExit('build_report block not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          t = Path('tests/test_ops_daily.py')
          text = t.read_text(encoding='utf-8')
          old = '''def _run_report(tmp_path: Path) -> tuple[dict, str]:
    repo_root = Path(__file__).resolve().parents[1]
'''
          new = '''def _run_report(tmp_path: Path) -> tuple[dict, str]:
    (tmp_path / "accounts").mkdir(exist_ok=True)
    (tmp_path / "accounts" / "info.env").write_text(
        "PROFI_DB=data/info.db\\n", encoding="utf-8"
    )
    repo_root = Path(__file__).resolve().parents[1]
'''
          if old not in text:
              raise SystemExit('report fixture block not found')
          text = text.replace(old, new, 1)
          text += '''


def test_daily_report_ignores_unconfigured_databases_and_canonical_logs(tmp_path: Path):
    (tmp_path / "data").mkdir()
    (tmp_path / "logs").mkdir()
    _make_db(tmp_path / "data" / "info.db")
    _make_db(tmp_path / "data" / "vps.db")
    (tmp_path / "logs" / "worker-vps.log").write_text(
        "2026-09-03 13:00:00 ERROR profi.main: FEED_CAPTURE_ERROR\\n",
        encoding="utf-8",
    )

    report, report_text = _run_report(tmp_path)

    assert set(report["accounts"]) == {"info"}
    assert '"vps"' not in report_text
    assert report["logs"]["ignored_other_log_files"] >= 1
'''
          t.write_text(text, encoding='utf-8')
          PY

      - name: Validate and format
        run: |
          uv sync
          uv run ruff format scripts/ops/daily_report.py tests/test_ops_daily.py
          uv run ruff check scripts/ops/daily_report.py tests/test_ops_daily.py
          uv run pytest -q tests/test_ops_daily.py tests/test_dashboard_export.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ops/daily_report.py tests/test_ops_daily.py
          git commit -m "fix: restrict ops metrics to configured accounts [ops-allowlist]"
          git push origin HEAD:feature/capability-dashboard-v1
