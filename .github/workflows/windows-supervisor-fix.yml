name: Windows supervisor validation fix

on:
  push:
    branches: [feature/windows-browser-supervisor-20260904]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Fix and validate
        run: |
          uv sync
          uv run ruff check --fix tests/test_windows_supervisor.py
          uv run ruff format tests/test_windows_supervisor.py
          uv run ruff check .
          uv run pytest -q tests/test_windows_supervisor.py
          uv run pytest -q
          uv run ruff format --check .
      - name: Commit formatting only
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_windows_supervisor.py
          git commit -m "style: normalize Windows supervisor tests"
          git push
