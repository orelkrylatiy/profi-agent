id = "info"
persona = "info"
remote_only = true

# Подстроки в title + description. Намеренно короткие стемы: так уже работает
# текущий hard_filter и сохраняется совместимость со старым PROFI_SUBJECTS.
subject_keywords = [
  "информатик",
  "программирован",
]

# Специфичные именно для этого оффера стоп-слова. Общие vacancy/barter/
# special-needs правила остаются глобальными в config.py.
# 04.09 (решение Макса): C++ и олимпиадное программирование — не наш профиль.
stop_patterns = [
  "c++",
  "с++",
  "олимпиад",
]

[fallback]
# Fallback — запасной путь при недоступной/невалидной LLM. Тексты намеренно
# короткие и функциональные: без мини-презентации и пересказа заявки.
enabled = true
templates = [
  "Здравствуйте! Могу помочь с информатикой. На первом занятии посмотрим, что уже получается, и решим, куда лучше упереться в первую очередь. Когда вам удобно попробовать?",
  "Добрый день! Работаю дистанционно. Я бы начал с одного пробного занятия: посмотрим текущий уровень и после этого спокойно определим план. Когда вам удобнее?",
]
