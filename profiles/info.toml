id = "info"
persona = "info"
remote_only = true

# Подстроки в title + description. Намеренно короткие стемы: так уже работает
# текущий hard_filter и сохраняется совместимость со старым PROFI_SUBJECTS.
subject_keywords = [
  "информатик",
  "программирован",
]

# Специфичные именно для этого оффера стоп-слова. Общие vacancy/barter/
# special-needs правила остаются глобальными в config.py.
stop_patterns = []

[fallback]
# Тексты уже хранятся рядом с профилем, но автоматический fallback при падении
# LLM пока не включён: подключим его вместе с fast-path, чтобы не менять
# поведение отправок отдельным скрытым способом.
enabled = true
templates = [
  "Здравствуйте! Могу помочь с информатикой и подготовкой по указанным темам. Занимаюсь дистанционно, на первом занятии посмотрим текущий уровень и определим, на чём лучше сфокусироваться. Подскажите, какая сейчас основная цель занятий?",
  "Добрый день! Готов помочь с информатикой. Обычно сначала разбираемся с текущими пробелами, после чего выстраиваем понятный план занятий. Подскажите, к какому результату сейчас хотите прийти?",
]
