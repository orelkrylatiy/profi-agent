id = "languages"
persona = "lang"
remote_only = true

# Один бизнес-профиль на языковую анкету: английский + испанский.
# Разделять в два top-level профиля стоит только если различаются оффер,
# персона, ставка или правила отбора.
subject_keywords = [
  "английск",
  "english",
  "испанск",
  "spanish",
]

# Не режем обычную языковую подготовку к собеседованию. Только явно
# карьерные Middle+/Senior кейсы со STAR-методикой, которые уже обсуждались
# как HR/interview coaching, а не урок языка.
stop_patterns = [
  "star-метод",
  "star метод",
  "star interview",
  "собеседование senior",
  "собеседование middle",
]

[fallback]
# Fallback — запасной путь при недоступной/невалидной LLM. Тексты намеренно
# короткие и функциональные: без мини-презентации и пересказа заявки.
enabled = true
templates = [
  "Здравствуйте! Могу помочь с языком. Работаю онлайн. На первом занятии посмотрим уровень и поймём, на что лучше сделать упор. Когда вам удобно попробовать?",
  "Добрый день! Я бы начала с пробного занятия на 60 минут: посмотрим, что уже получается, и дальше решим по плану. Если онлайн вам подходит, когда удобно попробовать?",
]
