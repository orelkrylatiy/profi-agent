id = "languages"
persona = "lang"
remote_only = true

# Один бизнес-профиль на языковую анкету: английский + испанский.
# Разделять в два top-level профиля стоит только если различаются оффер,
# персона, ставка или правила отбора.
subject_keywords = [
  "английск",
  "english",
  "испанск",
  "spanish",
]

# Не режем обычную языковую подготовку к собеседованию. Только явно
# карьерные Middle+/Senior кейсы со STAR-методикой, которые уже обсуждались
# как HR/interview coaching, а не урок языка.
stop_patterns = [
  "star-метод",
  "star метод",
  "star interview",
  "собеседование senior",
  "собеседование middle",
]

[fallback]
# Библиотека подготовлена заранее; автоматическая отправка fallback пока
# выключена в engine и будет подключаться отдельным fast-path изменением.
enabled = true
templates = [
  "Здравствуйте! Могу помочь с языком и выстроить занятия под вашу цель и текущий уровень. Работаю дистанционно, на первом занятии определим основные пробелы и дальнейший план. Подскажите, что сейчас важнее всего подтянуть?",
  "Добрый день! Готов помочь с изучением языка. Формат дистанционный, программу подстраиваю под текущий уровень и задачу ученика. Подскажите, какая цель занятий сейчас главная?",
]
