[project]
name = "profi-worker"
version = "0.1.0"
description = "Контур A: воркер откликов Профи.ру (читатель ленты → триаж → черновик → человек)"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.45",
]

[project.scripts]
profi = "profi.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/profi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
